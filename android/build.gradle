group 'pl.przelewy24.p24_sdk'
version '1.0-SNAPSHOT'
apply from: 'https://mobile.przelewy24.pl/p24lib.gradle'

buildscript {
    ext.kotlin_version = '2.3.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        p24()
    }
}

apply plugin: 'com.android.library'

// AGP 9+ can provide built-in Kotlin support, in which case applying the Kotlin
// Gradle Plugin (KGP) is an error. Built-in Kotlin is absent on AGP < 9 and is
// also disabled by `android.builtInKotlin=false` (the default emitted by the
// Flutter 3.44 migrator), and in both cases KGP is required to compile the
// Kotlin sources. Detect the resulting state rather than inferring it from the
// AGP version alone: if AGP already registered the `kotlin` extension, built-in
// Kotlin is active and KGP must not be applied.
// https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
if (extensions.findByName('kotlin') == null) {
    apply plugin: 'kotlin-android'
}

android {
    compileSdk 36
    namespace "pl.przelewy24.p24_sdk"

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdk 24
    }
    lint {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation "pl.przelewy24:p24lib:+"
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.gms:play-services-wallet:19.2.1'
}
