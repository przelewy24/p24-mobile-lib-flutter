name: p24_sdk_example
description: Demonstrates how to use the p24_sdk plugin.
publish_to: 'none'

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  p24_sdk:
    path: ../

  cupertino_icons: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Temporary workaround for flutter/flutter#186881 (SwiftPM fails when the repo
  # directory name != the plugin package name). Remove once the fix is in stable.
  # Only affects this example app; consumers keep using SwiftPM.
  config:
    enable-swift-package-manager: false
